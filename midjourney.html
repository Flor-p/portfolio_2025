<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Gallery — Flor Paramidani</title>
  <meta name="description" content="AI video gallery by Flor Paramidani — vertical and horizontal generative video pieces.">
  <link rel="icon" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200;300&family=Inter+Tight:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles_mj.css">
</head>
<body class="aig">

  <header class="aig-header">
    <a href="index.html#mj-preview" class="aig-back" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span>FLOR P.</span>
    </a>
    <nav class="aig-jump" aria-label="Gallery sections">
      <a href="#vertical">9:16</a>
      <a href="#horizontal">16:9</a>
    </nav>
  </header>

  <section class="aig-intro">
    <span class="aig-label">AI · Generative video</span>
    <h1 class="aig-title">AI GALLERY</h1>
    <p class="aig-lede">Short generative films and loops, made with Midjourney, Grok, Magnific and other video models.</p>
  </section>

  <!-- 01 · VERTICAL -->
  <section id="vertical" class="aig-vertical" aria-labelledby="vertical-title">
    <div class="aig-section-head">
      <span class="aig-index">01</span>
      <h2 id="vertical-title" class="aig-section-title">VERTICAL <em>9:16</em></h2>
    </div>
    <div class="aig-v-viewport">
      <ul class="aig-v-track" id="v-track"></ul>
    </div>
    <p class="aig-hint" aria-hidden="true">Scroll ↓ to move · click to watch with sound</p>
  </section>

  <!-- 02 · HORIZONTAL -->
  <section id="horizontal" class="aig-horizontal" aria-labelledby="horizontal-title">
    <div class="aig-section-head">
      <span class="aig-index">02</span>
      <h2 id="horizontal-title" class="aig-section-title">HORIZONTAL <em>16:9</em></h2>
    </div>
    <ol class="aig-h-list" id="h-list"></ol>
  </section>

  <footer class="aig-footer">
    <a href="index.html#portfolio" class="aig-cta">SEE THE REST OF THE WORK →</a>
  </footer>

  <!-- Lightbox -->
  <dialog class="aig-lightbox" id="lightbox" aria-label="Video player">
    <button class="aig-close" id="lightbox-close" aria-label="Close">CLOSE ✕</button>
    <video id="lightbox-video" controls playsinline></video>
    <p class="aig-lightbox-meta" id="lightbox-meta"></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script>
  /* ============================================================
     CONTENT — to add a piece, add one line here.
     src: Cloudinary URL as uploaded. ratio: "9:16" or "16:9".
     ============================================================ */
  const PIECES = [
    { ratio: "9:16", tool: "Midjourney", title: "Harajuku Creature",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776646729/flor_p_strange_creature_walking_around_Harajuku_Tokios_distri_885b34b1-68f9-4b1e-b085-15ebecf8a0ba_1_vdzhyo.mp4" },
    { ratio: "9:16", tool: "Grok", title: "Study 01",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776646181/grok-video-75b27faf-43e0-4c0b-bdb7-60ee14e76671_dbsety.mp4" },
    { ratio: "9:16", tool: "Midjourney", title: "Hyperreal Portrait",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776646729/flor_p_httpss.mj.runjgvT7E5G2Ws_A_hyper-photorealistic_ultra-_eaddbb77-f0ee-4ea7-9883-a736b598b5cd_0_w88czt.mp4" },
    { ratio: "9:16", tool: "Grok", title: "Study 02",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776646257/grok-video-2c1e01ce-edd9-421e-8eaa-4578b704f60a_ergdsb.mp4" },
    { ratio: "9:16", tool: "Grok", title: "Study 03",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776647118/grok-video-58a3d665-3889-4f0d-a7f3-428aedd0a32c_en3tko.mp4" },
    { ratio: "9:16", tool: "Grok", title: "Study 04",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776647056/grok-video-57b9756f-442a-4224-b4c1-631c9f2faf5d_mqrobm.mp4" },

    { ratio: "16:9", tool: "Magnific", title: "Recoleta Dog Walker",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1795288019/magnific_a-young-dog-walker-in-a-cap-and-sporty-jacket-holds-a-thick-bundle-of-leashes-attached-to-a-huge-pack-of-around-forty-dogs-of-every-breed-and-size-on-a-treelined-avenue-in-recoleta-buenos-air_cgrxhv.mp4" },
    { ratio: "16:9", tool: "AI Video", title: "Maneki Neko",
      src: "https://res.cloudinary.com/dztjjjmcb/video/upload/v1776637475/7_gtpwda.mp4" }
  ];

  /* Cloudinary helpers: inject transformations after /upload/ */
  const cld = (src, t) => src.replace("/upload/", `/upload/${t}/`);
  const videoUrl  = (src, w) => cld(src, `q_auto,w_${w},c_limit`);
  const posterUrl = (src, w) => cld(src, `so_0,q_auto,w_${w},c_limit`).replace(/\.mp4$/, ".jpg");
  const pad = n => String(n).padStart(2, "0");

  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function makeVideo(p, width) {
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true;
    v.preload = "none";
    v.poster = posterUrl(p.src, width);
    v.dataset.src = videoUrl(p.src, width);
    v.setAttribute("aria-hidden", "true");
    return v;
  }

  /* ---------- Render ---------- */
  const vTrack = document.getElementById("v-track");
  const hList  = document.getElementById("h-list");
  const vertical   = PIECES.filter(p => p.ratio === "9:16");
  const horizontal = PIECES.filter(p => p.ratio === "16:9");

  vertical.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = "aig-v-card";
    li.innerHTML = `
      <button class="aig-play" aria-label="Watch ${p.title} with sound">
        <span class="aig-meta"><span>${pad(i + 1)}</span><span>${p.tool}</span></span>
        <span class="aig-card-title">${p.title}</span>
      </button>`;
    li.querySelector(".aig-play").prepend(makeVideo(p, isMobile ? 480 : 720));
    li.querySelector(".aig-play").addEventListener("click", () => openLightbox(p, i + 1));
    vTrack.appendChild(li);
  });

  horizontal.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = "aig-h-item";
    li.innerHTML = `
      <div class="aig-h-info">
        <span class="aig-index">${pad(i + 1)}</span>
        <h3 class="aig-h-title">${p.title}</h3>
        <span class="aig-tool">${p.tool}</span>
      </div>
      <button class="aig-play aig-h-frame" aria-label="Watch ${p.title} with sound"></button>`;
    li.querySelector(".aig-h-frame").prepend(makeVideo(p, isMobile ? 960 : 1600));
    li.querySelector(".aig-h-frame").addEventListener("click", () => openLightbox(p, i + 1));
    hList.appendChild(li);
  });

  /* ---------- Play only what's on screen ---------- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(({ target: v, isIntersecting }) => {
      if (isIntersecting) {
        if (!v.src) v.src = v.dataset.src;
        if (!reduceMotion) v.play().catch(() => {});
      } else {
        v.pause();
      }
    });
  }, { threshold: 0.35 });
  document.querySelectorAll(".aig-v-card video, .aig-h-frame video").forEach(v => io.observe(v));

  /* ---------- Vertical: pinned horizontal scroll (desktop) ---------- */
  gsap.registerPlugin(ScrollTrigger);
  const mm = gsap.matchMedia();

  mm.add("(min-width: 769px) and (prefers-reduced-motion: no-preference)", () => {
    const cards = gsap.utils.toArray(".aig-v-card");
    const distance = () => vTrack.scrollWidth - window.innerWidth;

    const move = gsap.to(vTrack, {
      x: () => -distance(),
      ease: "none",
      scrollTrigger: {
        trigger: ".aig-vertical",
        start: "top top",
        end: () => "+=" + distance(),
        pin: true,
        scrub: 0.6,
        invalidateOnRefresh: true
      }
    });

    // Card in the center: full scale and opacity; neighbours recede
    cards.forEach(card => {
      gsap.fromTo(card,
        { scale: 0.82, opacity: 0.45 },
        { scale: 1, opacity: 1, ease: "sine.inOut", yoyo: true, repeat: 1,
          scrollTrigger: {
            trigger: card,
            containerAnimation: move,
            start: "left right",
            end: "right left",
            scrub: true
          }
        });
    });
  });

  /* Horizontal list: fade-up on enter */
  mm.add("(prefers-reduced-motion: no-preference)", () => {
    gsap.utils.toArray(".aig-h-item").forEach(item => {
      gsap.from(item, {
        y: 60, opacity: 0, duration: 1, ease: "power3.out",
        scrollTrigger: { trigger: item, start: "top 85%" }
      });
    });
  });

  /* ---------- Lightbox ---------- */
  const lb = document.getElementById("lightbox");
  const lbVideo = document.getElementById("lightbox-video");
  const lbMeta = document.getElementById("lightbox-meta");

  function openLightbox(p, n) {
    lb.classList.toggle("is-vertical", p.ratio === "9:16");
    lbVideo.src = videoUrl(p.src, p.ratio === "9:16" ? 1080 : 1920);
    lbVideo.poster = posterUrl(p.src, 1080);
    lbVideo.muted = false;
    lbMeta.textContent = `${pad(n)} · ${p.title} · ${p.tool} · ${p.ratio}`;
    lb.showModal();
    lbVideo.play().catch(() => {});
  }
  function closeLightbox() {
    lbVideo.pause();
    lbVideo.removeAttribute("src");
    lbVideo.load();
    lb.close();
  }
  document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
  lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
  lb.addEventListener("cancel", e => { e.preventDefault(); closeLightbox(); });
  </script>
</body>
</html>
